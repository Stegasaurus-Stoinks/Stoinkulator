[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: takes minutes; run with `pytest -m slow` (CI runs these)",
]

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["MainStoinker/DataCollection/Dumb dumb"]

[tool.ruff.lint]
# Legacy code is only checked for real defects (syntax errors, undefined
# names, broken comparisons). New code is held to the stricter set that CI
# passes explicitly:  ruff check tests --select E,F,W,I,B
# Widen this selection as modules are rewritten in milestone 1.
select = ["E9", "F63", "F7", "F82"]
